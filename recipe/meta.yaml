{% set name = "poetry" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 151ad741e163a329c8b13ea602dde979b7616fc350cfcff74b604e93263934a8

build:
  number: 1
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install --no-deps . -vv
  entry_points:
    - poetry = poetry.console.application:main

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - poetry-core 1.5
  run:
    - python
    - poetry-core 1.5.1
    - poetry-plugin-export >=1.3.0,<2.0.0
    - python-build >=0.10.0,<0.11.0
    - cachecontrol >=0.12.9,<0.13.0
    - filelock >=3.8.0
    - cleo >=2.0.0,<3.0.0
    - crashtest >=0.4.1,<0.5.0
    - dulwich >=0.21.2,<0.22.0
    - filelock >=3.8.0,<4.0.0
    - html5lib >=1.0,<2.0
    - importlib-metadata >=4.4  # [py<310]
    - python-installer >=0.6.0,<0.7.0
    - jsonschema >=4.10.0,<5.0.0
    - keyring >=23.9.0,<24.0.0
    - lockfile >=0.12.2,<0.13.0
    - packaging >=20.4
    - pexpect >=4.7.0,<5.0.0
    - pkginfo >=1.9.4,<2.0
    - platformdirs >=2.5.2,<3.0.0
    - pyproject_hooks >=1.0.0,<2.0.0
    - requests >=2.18,<3.0
    - requests-toolbelt >=0.9.1,<0.11.0
    - shellingham >=1.5,<2.0
    - tomli >=2.0.1,<3.0.0  # [py<311]
    - tomlkit >=0.11.1,<1.0.0,!=0.11.2,!=0.11.3
    - trove-classifiers >=2022.5.19
    # See <https://github.com/python-poetry/poetry/pull/6950>
    - virtualenv >=20.4.3,<21.0.0,!=20.4.5,!=20.4.6  # [unix]
    - virtualenv <20.16.6  # [win]
    - xattr >=0.10.0,<0.11.0  # [osx]
    - urllib3 >=1.26.0,<2.0.0
  run_constrained:
    - cachecontrol-with-filecache >=0.12.9,<0.13.0

test:
  requires:
    - pip
  commands:
    - pip check
    - poetry -V
  imports:
    - poetry
    - poetry.config

about:
  home: https://python-poetry.org/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python dependency management and packaging made easy
  description: |
    Poetry is a tool for dependency management and packaging in Python. 
    It allows you to declare the libraries your project depends on and it 
    will manage (install/update) them for you. Poetry offers a lockfile 
    to ensure repeatable installs, and can build your project for distribution.
  doc_url: https://python-poetry.org/docs/
  dev_url: https://github.com/python-poetry/poetry/

extra:
  recipe-maintainers:
    - BastianZim
    - ocefpaf
    - maresb
    - xylar
