{% set version = "1.4.0" %}

package:
  name: poetry
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/p/poetry/poetry-{{ version }}.tar.gz
  sha256: 151ad741e163a329c8b13ea602dde979b7616fc350cfcff74b604e93263934a8

build:
  number: 0
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install --no-deps . -vv
  entry_points:
    - poetry = poetry.console:main

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - poetry-core 1.5.2
  run:
    - python
    - cachecontrol >=0.12.4,<0.13.0
    # cachecontrol:filecache
    - lockfile >=0.9
    - cachy >=0.3.0,<0.4.0
    - cleo >=0.8.1,<0.9.0
    - clikit >=0.6.2,<0.7.0
    - crashtest >=0.3.0,<0.4.0  # [py>=36]
    - html5lib >=1.0,<2.0
    - jsonschema >=3.1,<4.0
    - pexpect >=4.7.0,<5.0.0
    - pkginfo >=1.4,<2.0
    - pyparsing >=2.2,<3.0
    - pyrsistent >=0.14.2,<0.19.0
    - requests-toolbelt >=0.9.1,<0.10.0
    - requests >=2.18,<3.0
    - shellingham >=1.1,<2.0
    - tomlkit >=0.7.0,<1.0.0
    - packaging >=20.4,<21.0
    - poetry-core >=1.0.0,<2.0.0
    - virtualenv >=20.0.26
    - platformdirs >=2,<3
    - keyring >=21.2.0,<24.0.0  # [py>=36]
    # legacy python
    - importlib-metadata >=1.6.0,<2.0.0  # [py<38]

test:
  # cannot do pip check b/c pip wants a non-windows dep in a windows package :-(
  # requires:
  #   - pip
  commands:
  #   - pip check
    - poetry -V
  imports:
    - poetry
    - poetry.config

about:
  home: https://python-poetry.org/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python dependency management and packaging made easy
  doc_url: https://python-poetry.org/docs/
  dev_url: https://github.com/python-poetry/poetry/

extra:
  recipe-maintainers:
    - Arun Babu Neelicattu
    - Bjorn Neergaard
    - Branch Vincent
    - Bryce Drennan
    - Daniel Eades
    - Randy Döring
    - Steph Samson
    - finswimmer
